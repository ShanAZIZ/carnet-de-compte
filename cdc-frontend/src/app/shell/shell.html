<div class="drawer lg:drawer-open">
  <input
    id="app-drawer"
    type="checkbox"
    class="drawer-toggle"
    tabindex="-1"
    aria-hidden="true"
    [checked]="isDrawerOpen()"
  />

  <div class="drawer-content flex flex-col">
    <header class="navbar bg-base-100 border-base-300 border-b lg:hidden">
      <button
        type="button"
        class="btn btn-square btn-ghost"
        aria-label="Ouvrir la navigation"
        aria-controls="app-nav"
        [attr.aria-expanded]="isDrawerOpen()"
        (click)="toggleDrawer(true)"
      >
        <span aria-hidden="true" class="text-xl">☰</span>
      </button>
      <span class="ml-2 text-lg font-bold">Mes Finances</span>
    </header>

    <main class="flex-1 p-6">
      <router-outlet />
    </main>
  </div>

  <div class="drawer-side">
    <button
      type="button"
      class="drawer-overlay absolute inset-0"
      tabindex="-1"
      aria-label="Fermer la navigation"
      (click)="toggleDrawer(false)"
    ></button>

    <nav
      id="app-nav"
      class="bg-base-200 flex min-h-full w-64 flex-col gap-4 p-4"
      aria-label="Navigation principale"
    >
      <p class="text-xl font-bold">Mes Finances</p>

      <ul class="menu w-full gap-1">
        @for (section of sections; track $index) {
          @if (section.title) {
            <li class="menu-title">{{ section.title }}</li>
          }
          @for (link of section.links; track link.path) {
            <li>
              <a
                [routerLink]="link.path"
                routerLinkActive="menu-active"
                (click)="toggleDrawer(false)"
                >{{ link.label }}</a
              >
            </li>
          }
        }
      </ul>

      @if (auth.user(); as user) {
        <div class="mt-auto flex flex-col gap-2">
          <p class="text-base-content/70 truncate text-sm">{{ user.email }}</p>
          <button type="button" class="btn btn-sm" (click)="signOut()">Se déconnecter</button>
        </div>
      }
    </nav>
  </div>
</div>
